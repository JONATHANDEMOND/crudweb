<div class="login-page">
  <div class="login-card shadow-lg">

    <div class="login-header text-center mb-4">
      <div class="logo-container mb-3 p-2 bg-white rounded-4 shadow-sm d-inline-block border">
        <img src="logo-pichincha.png" alt="Prefectura de Pichincha" class="img-fluid" style="max-height: 60px; object-fit: contain;">
      </div>
      <h2 class="fw-bold text-white mb-1" style="font-size: 1.5rem; letter-spacing: 0.5px;">Soporte Técnico</h2>
      <p class="text-white-50 mb-0" style="font-size: 0.8rem; line-height: 1.3;">Gobierno Autónomo Descentralizado de la Provincia de Pichincha</p>
    </div>

    <div class="login-body">
      <form (ngSubmit)="login()">
        <div class="input-group-custom mb-3">
          <label class="form-label text-light fw-semibold small"><i class="fas fa-user me-1 text-primary"></i> Usuario</label>
          <input type="text" class="form-control" [(ngModel)]="user" name="user" placeholder="Ingrese su usuario" required>
        </div>

        <div class="input-group-custom mb-4">
          <label class="form-label text-light fw-semibold small"><i class="fas fa-lock me-1 text-primary"></i> Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="pass" name="pass" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login w-100 py-2.5 fw-bold d-flex align-items-center justify-content-center gap-2 shadow-sm">
          <span>INGRESAR AL SISTEMA</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="alert-error mt-3 text-center text-danger small bg-danger bg-opacity-10 p-2 rounded" *ngIf="error">
        <i class="fas fa-exclamation-circle me-1"></i> Credenciales incorrectas, intente de nuevo.
      </div>
    </div>

    <!-- PIE DE PÁGINA ESTILIZADO -->
    <div class="login-footer text-center pt-3 mt-4 border-top border-secondary border-opacity-25" style="font-size: 0.72rem; color: #94a3b8; line-height: 1.4;">
      <div class="fw-bold text-light">Coordinación de Infraestructura, Redes y Soporte Técnico</div>
      <div class="text-muted">© 2026 Todos los derechos reservados.</div>
      <div class="text-info mt-1 fw-semibold" style="letter-spacing: 0.3px;">Desarrollado por: Jonathan Barros - CIRST</div>
    </div>

  </div>
</div>
